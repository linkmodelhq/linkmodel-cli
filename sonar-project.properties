# LinkModel CLI — SonarQube / SonarCloud Configuration
# Project Identity
sonar.projectKey=linkmodel-cli
sonar.projectName=linkmodel-cli
sonar.projectVersion=0.1.11

# Source & Test Roots
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts,test/**/*.test.js

# Language & Encoding
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage Report (LCOV format generated by scripts/test-coverage.mjs)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions from Analysis
sonar.exclusions=\
  **/dist/**,\
  **/test-dist/**,\
  **/coverage/**,\
  **/node_modules/**,\
  **/.claude/**,\
  scripts/**

# Exclusions from Test Coverage Metric
# - src/generated/**: Generated OpenAPI schema catalogs
# - src/commands/setup.ts: Interactive @inquirer/prompts terminal wizard (tested via manual QA)
sonar.coverage.exclusions=\
  src/generated/**,\
  src/commands/setup.ts

# Quality Gate Enforcement
sonar.qualitygate.wait=true
